<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Bobby's Best · week 3 props</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:1080px;margin:0 auto;padding:18px 14px 60px;color:#1a1a1a;background:#f7f7f8}
h1{font-size:24px;margin:0}h2{font-size:17px;margin:26px 0 8px;color:#333;border-bottom:1px solid #ddd;padding-bottom:4px}
