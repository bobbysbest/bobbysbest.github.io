const D = JSON.parse(document.getElementById('d').textContent);
const gsel = document.getElementById('g'), psel = document.getElementById('p'), statsBox = document.getElementById('stats'), out = document.getElementById('out');
function playersFor(gid){ const ids = gid === 'all' ? Object.keys(D.data) : [gid]; const arr = [];
  ids.forEach(g => Object.entries(D.data[g] || {}).forEach(([pid, pl]) => arr.push({g, pid, name: pl.name, team: pl.team})));
  arr.sort((a, b) => a.name.localeCompare(b.name)); return arr; }
function fill(){ const arr = playersFor(gsel.value);
  psel.innerHTML = '<option value="">choose a player (' + arr.length + ')</option>' + arr.map(a => `<option value="${a.g}|${a.pid}">${a.name} (${a.team})</option>`).join('');
  statsBox.innerHTML = ''; out.innerHTML = ''; }
function pick(){ const v = psel.value; if(!v){ statsBox.innerHTML = ''; out.innerHTML = ''; return; } const [g, pid] = v.split('|'); const pl = D.data[g][pid];
  statsBox.innerHTML = Object.entries(pl.stats).map(([k, st], i) => `<label><input type="radio" name="stat" value="${k}" ${i === 0 ? 'checked' : ''}><span>${st.label}</span></label>`).join('');
  statsBox.querySelectorAll('input').forEach(r => r.addEventListener('change', show)); show(); }
function tier(p){ return p >= 0.90 ? 'A' : p >= 0.85 ? 'B' : p >= 0.80 ? 'C' : ''; }
function bar(p, imp){ const mk = imp == null ? '' : `<div class='mk' style='left:${Math.round(imp*100)}%'></div>`;
  return `<div class='bar'><div class='fill' style='width:${Math.round(p*100)}%'></div>${mk}</div><div class='pct'>${(p*100).toFixed(1)}% model${imp == null ? '' : ' &middot; ' + (imp*100).toFixed(1) + '% price'}</div>`; }
function res(r){ return r ? `<span class='${r}'>${r.toUpperCase()}</span>` : ''; }
function show(){ const v = psel.value; const chk = statsBox.querySelector('input:checked'); if(!v || !chk){ out.innerHTML = ''; return; }
  const [g, pid] = v.split('|'); const pl = D.data[g][pid]; const st = pl.stats[chk.value]; const game = D.games.find(x => x.id === g);
  const act = st.actual == null ? '' : ` <span class='pill'>actual ${st.actual}</span>`;
  let h = `<h2>${pl.name} <span class='muted'>${pl.team}</span> &middot; ${st.label}${act}</h2><div class='game'>${game ? game.label : g}</div>`;
  let tbl = `<table><tr><th>rung</th><th>tier</th><th>price</th><th>probability (red mark = price)</th>${D.closed ? '<th>result</th>' : ''}</tr>`; let cards = '';
  st.rungs.forEach(r => { const over = (r.side === 'Over' || r.side === 'Yes'); const t = over ? tier(r.p) : '';
    const rung = st.label === 'Anytime TD' ? 'To score' : `${over ? 'Over' : 'Under'} ${r.x}` + (r.main ? ' <span class="pill">line</span>' : '');
    const price = r.price == null ? '<span class="muted">not posted</span>' : (r.price > 0 ? '+' : '') + r.price;
    const tb = `<span class='tier ${t || 'X'}'>${t || '&nbsp;'}</span>`;
    tbl += `<tr><td><b>${rung}</b></td><td>${tb}</td><td>${price}</td><td>${bar(r.p, r.imp)}</td>${D.closed ? '<td>' + res(r.res) + '</td>' : ''}</tr>`;
    cards += `<div class='card'><div class='l1'><span><b>${rung}</b></span><span>${tb} ${res(r.res)}</span></div><div class='l2'><span>${price}</span></div>${bar(r.p, r.imp)}</div>`; });
  out.innerHTML = h + "<div class='desk wrap'>" + tbl + "</table></div><div class='mob'>" + cards + "</div>"; }
gsel.innerHTML = '<option value="all">all games</option>' + D.games.map(g => `<option value="${g.id}">${g.label}${g.played ? ' (played)' : ''}</option>`).join('');
gsel.onchange = fill; psel.onchange = pick; fill();
</script><p class='muted'>Red mark = what the posted price implies. Tiers A 90%+, B 85-90, C 80-85 on the over rungs. Page written 2026-10-01 01:02.</p></body></html>
